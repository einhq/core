<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <!-- Opened from the home screen, the site runs without browser chrome. The
         manifest says so for Android; iOS before 16.4 only reads these tags. -->
    <meta name="theme-color" content="#101217" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="EiN" />
    <!-- Anchor bundle-injected relative asset URLs at root so SPA deep-links (served
         index.html via fallback) resolve ./index-<hash>.js against / not the route path. -->
    <base href="/" />
    <!-- The body colour before the stylesheet arrives, so a reload does not flash
         white. Keep in step with the body background, dark[7] in theme/tokens.ts. -->
    <meta name="color-scheme" content="dark" />
    <style>
    html,
    body {
      background: #16181d;
    }
    </style>
    <!-- The raster icon first, marked `sizes="any"`, so a browser that cannot draw an SVG icon
         keeps it and one that can prefers the SVG. The manifest and the touch icon are for
         adding the site to a home screen. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- What a chat or a social site shows for a link to EiN. Crawlers run no script and want the
         image's URL absolute, so the server puts the origin it was reached at in place of
         %EIN_ORIGIN% (get-default.ts); og:url is left out, so each link previews as itself. -->
    <meta name="description" content="Everything Is a Node" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EiN" />
    <meta property="og:title" content="EiN" />
    <meta property="og:description" content="Everything Is a Node" />
    <meta property="og:image" content="%EIN_ORIGIN%/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The EiN mark and name over a field of einstein hats in mixed colours" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>EiN</title>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
