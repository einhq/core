<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- EiN's mark, as EinMark draws it: one einstein hat cut into its eight kites, teal to orange.
       The raster icons beside it are rendered from this file. -->
