name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # From deno's own server, then GitHub's releases, each retried: one source answering 504
      # does not fail the run.
      - name: Install Deno
        run: |
          zip=deno-x86_64-unknown-linux-gnu.zip
          for url in https://dl.deno.land/release/v2.9.6/$zip https://github.com/denoland/deno/releases/download/v2.9.6/$zip; do
            curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/deno.zip" "$url" && break
          done
          mkdir -p "$HOME/.deno/bin"
          unzip -q -o "$RUNNER_TEMP/deno.zip" -d "$HOME/.deno/bin"
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
      - name: Format
        run: deno fmt --check
      - name: Lint
        run: deno task lint
      - name: Type-check
        run: deno task check
      - name: Test
        run: deno task test
