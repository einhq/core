name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Deno
        uses: ./.github/actions/deno
      - name: Format
        run: deno fmt --check
      - name: Lint
        run: deno task lint
      - name: Type-check
        run: deno task check
      - name: Test
        run: deno task test
