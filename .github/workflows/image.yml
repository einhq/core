name: image

# EiN's image, core with its web interface built in (src/Containerfile), published for the installer
# to pull: ghcr.io/einhq/core:main is main as of the last build, :sha-<commit> each commit built.
# Built once a day when main has moved since (ein/core#835), and at once when run by hand.
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

# One build at a time; a run started during it waits, and only the newest waiting run is kept.
concurrency:
  group: image
  cancel-in-progress: false

jobs:
  # Whether to build: a scheduled run builds nothing when main's commit already has its image.
  check:
    # GitHub alone publishes: a Forgejo that runs this repository's workflows has no use for it.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/core
        run: |
          sha=$(git rev-parse --short=9 HEAD)
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = schedule ] && docker manifest inspect "$IMAGE:sha-$sha" >/dev/null 2>&1; then
            echo "$IMAGE:sha-$sha exists"
            echo build=false >>"$GITHUB_OUTPUT"
          else
            echo build=true >>"$GITHUB_OUTPUT"
          fi

  image:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Stamp
        # What system-info reports the image runs: the commit and its date.
        run: git log -1 --format='{"commit":"%h","date":"%cI"}' >src/build.json
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: src/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/core:main
            ghcr.io/${{ github.repository_owner }}/core:sha-${{ needs.check.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=EiN with its web interface: run by compose from ein/deploy
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
