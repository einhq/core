name: image

# EiN's image, core with its web interface built in (src/Containerfile), published for the installer
# to pull: ghcr.io/einhq/ein:main is the newest commit on main, :sha-<commit> each one.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One build at a time; a push during it queues the newest commit only.
concurrency:
  group: image
  cancel-in-progress: false

jobs:
  image:
    # GitHub alone publishes: a Forgejo that runs this repository's workflows has no use for it.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Stamp
        id: stamp
        # What system-info reports the image runs: the commit and its date.
        run: |
          git log -1 --format='{"commit":"%h","date":"%cI"}' >src/build.json
          echo "sha=$(git rev-parse --short=9 HEAD)" >>"$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ein:main
            ghcr.io/${{ github.repository_owner }}/ein:sha-${{ steps.stamp.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=EiN with its web interface: run by compose from ein/deploy
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
