name: image

# EiN's image, core with its Web UI built in (src/Containerfile), published for installations to
# pull: ghcr.io/einhq/core:<version>, one image a release of version.json's version (ein/core#1419),
# built from its tag (v<version>, which the daily publish pushes with the snapshot that holds it,
# ein/core#1287) and never built again, so a version names one image. The label eu.einhq.version
# says the version too. Run by hand on a tag, it builds that release when it has no image yet, as
# after a failed build.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

# One build at a time; a run started during it waits, and only the newest waiting run is kept.
concurrency:
  group: image
  cancel-in-progress: false

jobs:
  # Whether to build: a release that has its image already is left as it is.
  check:
    # GitHub alone publishes: a Forgejo that runs this repository's workflows has no use for it.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/core
        run: |
          version=$(jq -r .version version.json)
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "no release version in version.json: $version"; exit 1; }
          [ "$GITHUB_REF" = "refs/tags/v$version" ] || { echo "$GITHUB_REF is not the release tag v$version"; exit 1; }
          echo "version=$version" >>"$GITHUB_OUTPUT"
          if docker manifest inspect "$IMAGE:$version" >/dev/null 2>&1; then
            echo "$IMAGE:$version exists"
            echo build=false >>"$GITHUB_OUTPUT"
          else
            echo build=true >>"$GITHUB_OUTPUT"
          fi

  image:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Stamp
        # What system-info reports the image runs: the commit and its date.
        run: git log -1 --format='{"commit":"%h","date":"%cI"}' >src/build.json
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: src/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/core:${{ needs.check.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
            eu.einhq.version=${{ needs.check.outputs.version }}
            org.opencontainers.image.description=EiN with its Web UI: run by compose from ein/deploy
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
