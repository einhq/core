name: image

# EiN's image, core with its Web UI built in (src/Containerfile), published for the installer
# to pull: ghcr.io/einhq/core:main is main as of the last build, :sha-<commit> each commit built,
# :<version> the newest build of version.json's version, which the publish releases
# (ein/core#1419), and :<line> the newest of its line (0.1 for 0.1.x, 1 for 1.x). The label
# eu.einhq.version says the version too. Built when GitHub's main moves, which the daily publish
# does (ein/core#1287), so the image is that day's (ein/core#1418); each morning after it, when
# main's commit has no image yet, which a failed build leaves; and at once when run by hand.
on:
  push:
    branches: [main]
  schedule:
    - cron: '47 7 * * *'
  workflow_dispatch:

# One build at a time; a run started during it waits, and only the newest waiting run is kept.
concurrency:
  group: image
  cancel-in-progress: false

jobs:
  # Whether to build: a scheduled run builds nothing when main's commit already has its image.
  check:
    # GitHub alone publishes: a Forgejo that runs this repository's workflows has no use for it.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      version: ${{ steps.check.outputs.version }}
      line: ${{ steps.check.outputs.line }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/core
        run: |
          sha=$(git rev-parse --short=9 HEAD)
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
          version=$(jq -r .version version.json)
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "no release version in version.json: $version"; exit 1; }
          major=${version%%.*} minor=${version#*.}
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "line=$([ "$major" = 0 ] && echo "0.${minor%%.*}" || echo "$major")" >>"$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = schedule ] && docker manifest inspect "$IMAGE:sha-$sha" >/dev/null 2>&1; then
            echo "$IMAGE:sha-$sha exists"
            echo build=false >>"$GITHUB_OUTPUT"
          else
            echo build=true >>"$GITHUB_OUTPUT"
          fi

  image:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Stamp
        # What system-info reports the image runs: the commit and its date.
        run: git log -1 --format='{"commit":"%h","date":"%cI"}' >src/build.json
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: src/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/core:main
            ghcr.io/${{ github.repository_owner }}/core:sha-${{ needs.check.outputs.sha }}
            ghcr.io/${{ github.repository_owner }}/core:${{ needs.check.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/core:${{ needs.check.outputs.line }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            eu.einhq.version=${{ needs.check.outputs.version }}
            org.opencontainers.image.description=EiN with its Web UI: run by compose from ein/deploy
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
